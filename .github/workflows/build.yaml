name: build

# The build of each system, then -solve of FFO 1-19 (one thread, exact) compared with the scores of the problem file:
# the number of results, the score and the best move of each position (tests/check-solve.py).
on:
  pull_request:
    paths: ['src/**', 'include/**', 'problem/**', 'tests/check-solve.py', '.github/workflows/build.yaml']
  push:
    branches: [ edax-4.5.5-fixes ]
    paths: ['src/**', 'include/**', 'problem/**', 'tests/check-solve.py', '.github/workflows/build.yaml']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false # We want results from all OSes even if one fails.
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            build_command: make build ARCH=x86-64-v3 COMP=gcc OS=linux # (names of src/Makefile: x64-modern and armv8.5-a were not)
            exe: lEdax-x86-64-v3
          - os: macos-latest
            build_command: make build ARCH=arm64 COMP=clang OS=osx
            exe: mEdax-arm64

    steps:
    - uses: actions/checkout@v4

    - name: build
      run: |-
        mkdir -p bin
        cd src
        ${{ matrix.build_command }}

    - name: solve FFO 1-19 and compare with the scores of the problem file
      run: python3 tests/check-solve.py bin/${{ matrix.exe }} problem/fforum-1-19.obf --cwd bin

    - name: the comparison fails with a wrong score
      run: |-
        sed 's/G8:+18;/G8:+64;/' problem/fforum-1-19.obf > wrong-score.obf
        grep -q 'G8:+64;' wrong-score.obf
        rc=0
        python3 tests/check-solve.py bin/${{ matrix.exe }} wrong-score.obf --cwd bin || rc=$?
        test "$rc" -eq 1

    - uses: actions/upload-artifact@v4
      with:
        name: artifact_${{ runner.os }}
        path: bin

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: build
      run: |-
        mkdir -p bin
        cd src
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        nmake -fnmakefile vc-x64-v3
      shell: cmd

    - name: solve FFO 1-19 and compare with the scores of the problem file
      run: python tests\check-solve.py bin\wEdax-x86-64-v3.exe problem\fforum-1-19.obf --cwd bin
      shell: cmd

    - uses: actions/upload-artifact@v4
      with:
        name: artifact_${{ runner.os }}
        path: bin
